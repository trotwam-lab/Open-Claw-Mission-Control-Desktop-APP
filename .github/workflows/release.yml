name: Build and Publish Release Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Build release package
        run: ./scripts/build_release.sh

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-claw-mission-control-${{ steps.version.outputs.version }}
          path: |
            dist/open-claw-mission-control-${{ steps.version.outputs.version }}.zip
            dist/open-claw-mission-control-${{ steps.version.outputs.version }}.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/open-claw-mission-control-${{ steps.version.outputs.version }}.zip
            dist/open-claw-mission-control-${{ steps.version.outputs.version }}.sha256
          generate_release_notes: true
